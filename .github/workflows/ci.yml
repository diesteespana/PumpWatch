name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend — lint + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pumpwatch_test
          POSTGRES_USER: pumpwatch
          POSTGRES_PASSWORD: pumpwatch
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://pumpwatch:pumpwatch@localhost:5432/pumpwatch_test
          APP_SECRET_KEY: test-secret-key-32-chars-minimum!!
          JWT_SECRET_KEY: test-jwt-secret-key-32-chars-min!!
          ETHERSCAN_API_KEY: test-key
        run: pytest

  frontend-test:
    name: Frontend — lint + type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Lint
        working-directory: frontend
        run: npm run lint

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pumpwatch-backend ./backend

      - name: Build frontend image
        run: docker build -t pumpwatch-frontend ./frontend
