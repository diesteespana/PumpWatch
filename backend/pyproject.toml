[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpwatch-backend"
version = "0.1.0"
description = "PumpWatch — On-chain analytics backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    # HTTP client
    "httpx>=0.27",
    # Scheduler
    "apscheduler>=3.10",
    # Cache / rate limit
    "redis>=5.0",
    # Logging
    "structlog>=24.1",
    # Notifications
    "aiosmtplib>=3.0",
    "python-telegram-bot>=21.0",
    # AI
    "anthropic>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",         # async test client
    "factory-boy>=3.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-passlib",
    "types-python-jose",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "RET", "SIM"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
