version: "3.9"

# Override for local development: hot reload, no prod optimisations.
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
    volumes:
      - ./backend:/app

  frontend:
    command: npm run dev
    environment:
      NODE_ENV: development
